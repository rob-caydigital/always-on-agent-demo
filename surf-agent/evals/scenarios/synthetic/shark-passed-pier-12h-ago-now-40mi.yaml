  marine_text: "W winds 5 to 10 kt. Seas 3 to 4 ft. Wave Detail: E 4 ft at 11 seconds."
  sharks:
    - {species: "White Shark (Carcharodon carcharias)", stage: "Adult", distance_mi: 2, age_h: 12, name: Passerby}
expect:
