[project]
name = "surf-agent"
version = "0.1.0"
description = "5 AM surf check: NOAA conditions -> score -> Claude assessment -> Alexa wake-up"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.80",
    "astral>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
surf-check = "surf_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surf_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real external APIs (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: typer.Option() in defaults is Typer's documented idiom. C408: dict() kwargs read better in tests.
ignore = ["B008", "C408"]
